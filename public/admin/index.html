<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mad Robin CMS</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      // Manual init so we can configure local_backend on localhost
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- Pinned: ^3.0.0 floats to brand-new releases; 3.13/3.14 broke entry editing via git-gateway -->
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      if (location.hostname === "localhost") {
        CMS.init({ config: { local_backend: true } });
      } else {
        CMS.init();
      }
    </script>
  </body>
</html>
