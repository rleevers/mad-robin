backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

# Publish mode - editorial workflow allows draft/review/publish
publish_mode: editorial_workflow

collections:
  # ============ Events ============
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Address", name: "address", widget: "string", required: false }
      - { label: "Map Link", name: "mapLink", widget: "string", required: false, hint: "Google Maps share link for the venue" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Ticket Link", name: "ticketLink", widget: "string", required: false }
      - { label: "Ticket Price", name: "ticketPrice", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  # ============ Testimonials ============
  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client Name", name: "clientName", widget: "string" }
      - label: "Event Type"
        name: "eventType"
        widget: "select"
        options: ["Wedding", "Corporate", "Private Party", "Public Ceilidh", "Other"]
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Quote", name: "body", widget: "markdown" }

  # ============ Gallery ============
  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Alt Text", name: "alt", widget: "string" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Weddings", "Barn Dances", "Private", "Public"]
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  # ============ Band Members ============
  - name: "members"
    label: "Band Members"
    folder: "src/content/members"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Instrument", name: "instrument", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Is Caller", name: "isCaller", widget: "boolean", default: false }
      - { label: "Bio", name: "body", widget: "markdown" }

  # ============ What to Expect ============
  - name: "what-to-expect"
    label: "What to Expect"
    folder: "src/content/what-to-expect"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ============ FAQ ============
  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["General", "Booking", "On the Day", "Music"]
        default: "General"
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Answer", name: "body", widget: "markdown" }

  # ============ Packages ============
  - name: "packages"
    label: "Packages"
    folder: "src/content/packages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Starting Price", name: "startingPrice", widget: "string" }
      - label: "Features"
        name: "features"
        widget: "list"
        field: { label: "Feature", name: "feature", widget: "string" }
      - { label: "Popular", name: "popular", widget: "boolean", default: false }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  # ============ Site Settings ============
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "site"
        file: "src/data/settings/site.yml"
        fields:
          - { label: "Band Name", name: "bandName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Response Promise", name: "responsePromise", widget: "string" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
