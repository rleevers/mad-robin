backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

# Direct publish: saving an entry commits straight to the main branch.
# (Editorial workflow / draft PRs needs the Git Gateway GitHub token to have
# Pull Request permission, which it has lost — and a sole editor doesn't need
# a review step. Re-add `publish_mode: editorial_workflow` if that's restored.)

collections:
  # ============ Events ============
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Start Time", name: "startTime", widget: "string", required: false, hint: "e.g. 19:30 — used for calendar links" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Map Link", name: "mapLink", widget: "string", required: false, hint: "Google Maps share link for the venue" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Sell tickets on website", name: "ticketingEnabled", widget: "boolean", default: false, hint: "Turn on to show the Buy Tickets widget on the event page" }
      - { label: "Ticket capacity", name: "capacity", widget: "number", required: false, value_type: "int", hint: "Total number of tickets available" }
      - { label: "Early bird ends", name: "earlyBirdUntil", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Last day of early bird prices — they revert to full price at the end of this day. Leave empty for no early bird." }
      - label: "Ticket tiers"
        name: "tiers"
        widget: "list"
        required: false
        hint: "Add one row per ticket type, e.g. Adult £10, Concession £8"
        fields:
          - { label: "Name", name: "name", widget: "string", hint: "e.g. Adult, Concession, Child" }
          - { label: "Price (£)", name: "price", widget: "number", value_type: "float", step: 0.5 }
          - { label: "Early bird price (£)", name: "earlyBirdPrice", widget: "number", value_type: "float", step: 0.5, required: false, hint: "Discounted price until the early bird deadline. Leave empty for no early bird on this tier." }

  # ============ Testimonials ============
  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client Name", name: "clientName", widget: "string" }
      - label: "Event Type"
        name: "eventType"
        widget: "select"
        options: ["Wedding", "Corporate", "Private Party", "Public Ceilidh", "Other"]
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Quote", name: "body", widget: "markdown" }

  # ============ Gallery ============
  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    summary: "{{sortOrder}} — {{title}} ({{category}})"
    sortable_fields: ["title", "sortOrder", "category"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Label for this item (shown in CMS list only, not on the website)" }
      - { label: "Image", name: "image", widget: "image", required: false, hint: "Thumbnail for the gallery grid. Optional if uploading a video." }
      - { label: "Video", name: "video", widget: "file", required: false, hint: "Optional MP4 video. Keep under 50 MB.", media_library: { config: { accept: ".mp4" } } }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Weddings", "Barn Dances", "Private", "Public"]
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }

  # ============ Band Members ============
  - name: "members"
    label: "Band Members"
    folder: "src/content/members"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Instrument", name: "instrument", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Bio", name: "body", widget: "markdown" }

  # ============ What to Expect ============
  - name: "what-to-expect"
    label: "What to Expect"
    folder: "src/content/what-to-expect"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ============ FAQ ============
  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "Answer", name: "body", widget: "markdown" }

  # ============ Site Settings ============
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "site"
        file: "src/data/settings/site.yml"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Phone Note", name: "phoneNote", widget: "string", hint: "Shown below the phone number, e.g. 'Please leave a message'" }
          - { label: "Response Promise", name: "responsePromise", widget: "string" }
          - { label: "Showreel URL", name: "showreelUrl", widget: "string", required: false, hint: "Paste a YouTube link to embed on the homepage. Leave empty for the placeholder." }
          - label: "Social Links"
            name: "socialLinks"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false, hint: "Full URL, e.g. https://facebook.com/madrobinband" }
              - { label: "Instagram", name: "instagram", widget: "string", required: false, hint: "Full URL, e.g. https://instagram.com/madrobinband" }
              - { label: "YouTube", name: "youtube", widget: "string", required: false, hint: "Full URL, e.g. https://youtube.com/@madrobinband" }
